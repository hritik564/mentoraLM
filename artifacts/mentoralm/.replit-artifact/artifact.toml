kind = "web"
previewPath = "/"
title = "MentorAlm"
version = "1.0.0"
id = "artifacts/mentoralm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22370

[services.development]
run = "pnpm --filter @workspace/mentoralm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mentoralm", "run", "build" ]
publicDir = "artifacts/mentoralm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22370"
BASE_PATH = "/"
